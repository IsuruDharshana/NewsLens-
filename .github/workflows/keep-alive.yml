name: Keep Render backend awake

# Render's free tier spins down after ~15 minutes of inactivity. This job
# pings the /health endpoint every 10 minutes so the backend stays warm.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping NewsLens health endpoint
        run: |
          curl -sS --max-time 30 \
            https://newslens-wcki.onrender.com/health \
            -o /dev/null -w "HTTP %{http_code} - %{time_total}s\n"
